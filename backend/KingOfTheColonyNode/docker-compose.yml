services:
  postgres:
    image: postgres:16-alpine
    container_name: kotc-node-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - kotc-node-postgres-data:/var/lib/postgresql/data

  mongodb:
    image: mongo:7
    container_name: kotc-node-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: root
    ports:
      - "27017:27017"
    volumes:
      - kotc-node-mongodb-data:/data/db

  redis:
    image: redis:7-alpine
    container_name: kotc-node-redis
    ports:
      - "6379:6379"

volumes:
  kotc-node-postgres-data:
  kotc-node-mongodb-data: